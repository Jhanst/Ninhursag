<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090914">
  <title>Ninhursag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Ninhursag</h1>
      <p>Your AI companion</p>
    </header>

    <section id="chat" class="chat">
      <div class="message assistant">
        Well, look who's here. What are we getting into today?
      </div>
    </section>

    <form id="chat-form">
      <input id="message-input" placeholder="Talk to Ninhursag..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
